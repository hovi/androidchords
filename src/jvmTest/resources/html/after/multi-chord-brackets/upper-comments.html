<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <title>multi-chord-brackets</title>
    <link href="style.css"/>
    <style rel="stylesheet">
    </style>
</head>
<body>
<!-- @formatter:off -->
<div class='main-song-content layout-upper theme-light font-normal  has-sections'>
    <div class='section section-0 section-type-verse section-type-verse0'>
        <div class="header">VERSE</div>
        <div class="section-content">
            <div class='song-text-line song-line song-line-has-text song-line-has-chords'>
                <div class="song-chord-pair song-chord-pair ">
                    <div class="song-chord"><a class='chord' href='chord://C'>C</a></div>
                    <div class="song-text content" style=""><span class="text"> </span></div>
                </div>
                <div class="song-chord-pair song-chord-pair ">
                    <div class="song-chord"><a class='chord' href='chord://G'>G</a></div>
                    <div class="song-text content" style=""><span class="text"> </span></div>
                </div>
                <div class="song-chord-pair song-chord-pair ">
                    <div class="song-chord"><a class='chord' href='chord://Am'>Am</a></div>
                    <div class="song-text content" style=""><span class="text">Tři akordy v jedné závorce,</span></div>
                </div>
            </div>
            <div class='song-text-line song-line song-line-has-text song-line-has-chords'>
                <div class="song-chord-pair song-chord-pair ">
                    <div class="song-chord"><a class='chord' href='chord://C'>C</a></div>
                    <div class="song-text content" style=""><span class="text"></span></div>
                </div>
                <div class="song-chord-pair song-chord-pair ">
                    <div class="song-chord"><a class='chord' href='chord://G'>G</a></div>
                    <div class="song-text content" style=""><span class="text">čárkou oddělené,</span></div>
                </div>
            </div>
            <div class='song-text-line song-line song-line-has-text song-line-has-chords'>
                <div class="song-chord-pair song-chord-pair ">
                    <div class="song-chord"><a class='chord' href='chord://Dmi'>Dmi</a></div>
                    <div class="song-text content" style=""><span class="text"> </span></div>
                </div>
                <div class="song-chord-pair song-chord-pair ">
                    <div class="song-chord"><a class='chord' href='chord://C#'>C#</a></div>
                    <div class="song-text content" style=""><span class="text"> </span></div>
                </div>
                <div class="song-chord-pair song-chord-pair ">
                    <div class="song-chord"><a class='chord' href='chord://G#mi'>G#mi</a></div>
                    <div class="song-text content" style=""><span class="text">s mezerami po čárce,</span></div>
                </div>
            </div>
            <div class='song-text-line song-line song-line-has-text song-line-has-chords'>
                <div class="song-chord-pair song-chord-pair  empty-chord ">
                    <div class="song-chord"><a class='chord' href='chord://&nbsp;'>&nbsp;</a></div>
                    <div class="song-text content" style=""><span class="text">konec řádku </span></div>
                </div>
                <div class="song-chord-pair song-chord-pair ">
                    <div class="song-chord"><a class='chord' href='chord://F'>F</a></div>
                    <div class="song-text content" style=""><span class="text"></span></div>
                </div>
                <div class="song-chord-pair song-chord-pair ">
                    <div class="song-chord"><a class='chord' href='chord://F#'>F#</a></div>
                    <div class="song-text content" style=""><span class="text"></span></div>
                </div>
                <div class="song-chord-pair song-chord-pair ">
                    <div class="song-chord"><a class='chord' href='chord://G'>G</a></div>
                    <div class="song-text content" style=""><span class="text"></span></div>
                </div>
            </div>
        </div>
    </div>
    
</div>
<!-- @formatter:on -->
</body>
</html>
