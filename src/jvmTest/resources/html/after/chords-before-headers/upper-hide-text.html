<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <title>chords-before-headers</title>
    <link href="style.css"/>
    <style rel="stylesheet">
    </style>
</head>
<body>
<!-- @formatter:off -->
<div class='main-song-content layout-upper theme-light font-normal hide-text hide-comments  has-sections'>
    <div class='section section-0 section-type-intro section-type-intro0'>
        <div class="header">INTRO</div>
        <div class="section-content">
            <div class='song-text-line song-line song-line-no-text song-line-has-chords'>
                <div class="song-chord-pair song-chord-pair ">
                    <div class="song-chord"><a class='chord' href='chord://C'>C</a></div>
                    <div class="song-text content" style=""><span class="text"> </span></div>
                </div>
                <div class="song-chord-pair song-chord-pair ">
                    <div class="song-chord"><a class='chord' href='chord://G'>G</a></div>
                    <div class="song-text content" style=""><span class="text"></span></div>
                </div>
            </div>
        </div>
    </div>
    <div class='section section-0 section-type-verse section-type-verse0'>
        <div class="header">VERSE</div>
        <div class="section-content">
            <div class='song-text-line song-line song-line-has-text song-line-no-chords'>
                <div class="song-chord-pair song-chord-pair  empty-chord ">
                    <div class="song-chord"><a class='chord' href='chord://&nbsp;'>&nbsp;</a></div>
                    <div class="song-text content" style=""><span class="text">Verse after a blank line</span></div>
                </div>
            </div>
            <div class='song-text-line song-line song-line-no-text song-line-has-chords'>
                <div class="song-chord-pair song-chord-pair ">
                    <div class="song-chord"><a class='chord' href='chord://Am'>Am</a></div>
                    <div class="song-text content" style=""><span class="text"> </span></div>
                </div>
                <div class="song-chord-pair song-chord-pair ">
                    <div class="song-chord"><a class='chord' href='chord://F'>F</a></div>
                    <div class="song-text content" style=""><span class="text"></span></div>
                </div>
            </div>
            <div class='song-text-line song-line song-line-has-text song-line-no-chords comment-line'>
                <div class="song-chord-pair song-chord-pair  empty-chord ">
                    <div class="song-chord"><a class='chord' href='chord://&nbsp;'>&nbsp;</a></div>
                    <div class="song-text content" style=""><span class="text"><comment> komentář</comment></span></div>
                </div>
            </div>
        </div>
    </div>
    <div class='section section-1 section-type-verse section-type-verse1'>
        <div class="header">VERSE (2)</div>
        <div class="section-content">
            <div class='song-text-line song-line song-line-has-text song-line-no-chords'>
                <div class="song-chord-pair song-chord-pair  empty-chord ">
                    <div class="song-chord"><a class='chord' href='chord://&nbsp;'>&nbsp;</a></div>
                    <div class="song-text content" style=""><span class="text">Verse after a comment</span></div>
                </div>
            </div>
        </div>
    </div>
    <div class='section section-0 section-type-chorus section-type-chorus0'>
        <div class="header">CHORUS</div>
        <div class="section-content">
            <div class='song-text-line song-line song-line-has-text song-line-has-chords repeated-chords'>
                <div class="song-chord-pair song-chord-pair ">
                    <div class="song-chord"><a class='chord' href='chord://Am'>Am</a></div>
                    <div class="song-text content" style=""><span class="text">   C</span></div>
                </div>
                <div class="song-chord-pair song-chord-pair ">
                    <div class="song-chord"><a class='chord' href='chord://F'>F</a></div>
                    <div class="song-text content" style=""><span class="text">horus right under its chords</span></div>
                </div>
            </div>
            <div class='song-text-line song-line song-line-has-text song-line-no-chords'>
                <div class="song-chord-pair song-chord-pair  empty-chord ">
                    <div class="song-chord"><a class='chord' href='chord://&nbsp;'>&nbsp;</a></div>
                    <div class="song-text content" style=""><span class="text">lyric line</span></div>
                </div>
            </div>
        </div>
    </div>
    <div class='section section-2 section-type-verse section-type-verse2'>
        <div class="header">VERSE (3)</div>
        <div class="section-content">
            <div class='song-text-line song-line song-line-has-text song-line-has-chords repeated-chords'>
                <div class="song-chord-pair song-chord-pair ">
                    <div class="song-chord"><a class='chord' href='chord://C'>C</a></div>
                    <div class="song-text content" style=""><span class="text">  </span></div>
                </div>
                <div class="song-chord-pair song-chord-pair ">
                    <div class="song-chord"><a class='chord' href='chord://G'>G</a></div>
                    <div class="song-text content" style=""><span class="text"> Chords directly above move here</span></div>
                </div>
            </div>
        </div>
    </div>
    <div class='section section-0 section-type-outro section-type-outro0'>
        <div class="header">OUTRO</div>
        <div class="section-content">
            <div class='song-text-line song-line song-line-no-text song-line-has-chords'>
                <div class="song-chord-pair song-chord-pair ">
                    <div class="song-chord"><a class='chord' href='chord://C'>C</a></div>
                    <div class="song-text content" style=""><span class="text"></span></div>
                </div>
            </div>
        </div>
    </div>
    <div class='section section-0 section-type-chorus section-type-chorus0 section-copy section-repeat-only'>
        <div class="header">CHORUS</div>
        <div class="section-content">
            <div class='song-text-line song-line song-line-has-text song-line-has-chords repeated-chords'>
                <div class="song-chord-pair song-chord-pair ">
                    <div class="song-chord"><a class='chord' href='chord://Am'>Am</a></div>
                    <div class="song-text content" style=""><span class="text">   C</span></div>
                </div>
                <div class="song-chord-pair song-chord-pair ">
                    <div class="song-chord"><a class='chord' href='chord://F'>F</a></div>
                    <div class="song-text content" style=""><span class="text">horus right under its chords</span></div>
                </div>
            </div>
            <div class='song-text-line song-line song-line-has-text song-line-no-chords'>
                <div class="song-chord-pair song-chord-pair  empty-chord ">
                    <div class="song-chord"><a class='chord' href='chord://&nbsp;'>&nbsp;</a></div>
                    <div class="song-text content" style=""><span class="text">lyric line</span></div>
                </div>
            </div>
        </div>
    </div>
    
</div>
<!-- @formatter:on -->
</body>
</html>
