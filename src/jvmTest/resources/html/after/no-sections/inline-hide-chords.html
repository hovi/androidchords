<html>
<head>
    <meta charset="UTF-8">

    <title>no-sections</title>
    <link href="style.css"/>
    <style rel="stylesheet">
    </style>
</head>
<body>
<!-- @formatter:off -->
<div class='main-song-content layout-inline theme-light font-normal hide-chords hide-comments  has-sections section-single-unknown section-single-empty'>
    <div class='section section-0 section-type-empty section-type-empty0'>
        <div class="header">EMPTY</div>
        <div class="section-content">
            <div class='song-text-line song-line song-line-has-text song-line-has-chords'>
                <div class="song-chord-pair song-chord-pair  content"><a class='chord' href='chord://Am'>Am</a><span class="text">Bez nadpis</span></div>
                <div class="song-chord-pair song-chord-pair  content"><a class='chord' href='chord://Dm'>Dm</a><span class="text">u píseň jde,</span></div>
            </div>
            <div class='song-text-line song-line song-line-has-text song-line-has-chords'>
                <div class="song-chord-pair song-chord-pair  content"><a class='chord' href='chord://E7'>E7</a><span class="text">nikdo neví, </span></div>
                <div class="song-chord-pair song-chord-pair  content"><a class='chord' href='chord://Am'>Am</a><span class="text">kde je refrén.</span></div>
            </div>
            <div class='song-text-line song-line song-line-has-text song-line-has-chords repeated-chords'>
                <div class="song-chord-pair song-chord-pair  content"><a class='chord' href='chord://Am'>Am</a><span class="text">Druhá řádk</span></div>
                <div class="song-chord-pair song-chord-pair  content"><a class='chord' href='chord://Dm'>Dm</a><span class="text">a bez sekcí,</span></div>
            </div>
            <div class='song-text-line song-line empty-line song-line-no-text song-line-no-chords'>
                <div class="song-chord-pair song-chord-pair  empty-chord  empty-pair  content">&nbsp;<span class="text"></span></div>
            </div>
            <div class='song-text-line song-line song-line-has-text song-line-has-chords repeated-chords'>
                <div class="song-chord-pair song-chord-pair  content"><a class='chord' href='chord://E7'>E7</a><span class="text">a pak prázdný </span></div>
                <div class="song-chord-pair song-chord-pair  content"><a class='chord' href='chord://Am'>Am</a><span class="text">řádek nad koncem.</span></div>
            </div>
        </div>
    </div>
    
</div>
<!-- @formatter:on -->
