<html>
<head>

    <title>western-naming</title>
    <style>
        .hide-comments comment {
            display: none;
        }
        comment {
            display: block;
            font-style: italic;
        }
        img {
            max-width: 100%;
        }
        h1 { font-size: 1.25em; }
        .chord {
            text-decoration: none;
            color: black !important;
        }
        .content {
            white-space: pre-wrap; tab-size: 1;
        }
        /* settings-specific */
        .font-monospace, .font-monospace .chord {
            font-family: 'monospace' !important;
        }
        .font-serif, .font-serif .chord {
            font-family: 'serif' !important;
        }
        .font-normal, .font-normal .chord {
            font-family: 'normal' !important;
        }
        .double-column {
            column-count: 2; column-gap: 30px; -webkit-column-count: 2; -webkit-column-gap: 30px;
        }
        .big-chords .chord { font-size: 150% !important; }
        .bold, .bold .chord {
            font-weight: 900 !important;
        }
        /* the same hiding as in style.scss for the legacy layout */
        .hide-chords .legacy-chord, .hide-chords .chord-row:not(.section-header),
        .hide-chords .song-line-has-chords.song-line-no-text:not(.section-header),
        .hide-text .legacy-text, .hide-text .text-row, .hide-text .legacy-row:not(.song-line-has-chords),
        .hide-comments .comment-line,
        .hide-identical-sequences .repeated-chords .legacy-chord,
        .hide-identical-sequences .repeated-chords.chord-row:not(.section-header),
        .hide-identical-sequences .repeated-chords.song-line-no-text:not(.section-header) {
            display: none;
        }
    </style>
</head>
<body class='theme-light font-normal hide-comments'>
