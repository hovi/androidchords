<html>
<head>

    <title>english-headers</title>
    <link href="style.css"/>

    </style>

<body>
<!-- @formatter:off -->
<div class='main-song-content layout-inline theme-light font-normal hide-comments hide-identical-sequences  has-sections'>
    <div class='section section-0 section-type-verse section-type-verse0'>
        <div class="header">VERSE</div>
        <div class="section-content">
            <div class='song-text-line song-line song-line-has-text song-line-has-chords'>
                <div class="song-chord-pair song-chord-pair  content"><a class='chord' href='chord://G'>G</a><span class="text">Walking down the </span></div>
                <div class="song-chord-pair song-chord-pair  content"><a class='chord' href='chord://D'>D</a><span class="text">empty road,</span></div>
            </div>
            <div class='song-text-line song-line song-line-has-text song-line-has-chords'>
                <div class="song-chord-pair song-chord-pair  content"><a class='chord' href='chord://Em'>Em</a><span class="text">carrying a </span></div>
                <div class="song-chord-pair song-chord-pair  content"><a class='chord' href='chord://C'>C</a><span class="text">heavy load.</span></div>
            </div>
        </div>
    </div>
    <div class='section section-0 section-type-chorus section-type-chorus0'>

            <div class='song-text-line song-line song-line-has-text song-line-has-chords'>
                <div class="song-chord-pair song-chord-pair  content"><a class='chord' href='chord://C'>C</a><span class="text">Oh, </span></div>

            </div>
        </div>
    </div>
    <div class='section section-1 section-type-verse section-type-verse1'>
        <div class="header">VERSE (2)</div>
        <div class="section-content">
            <div class='song-text-line song-line song-line-has-text song-line-has-chords repeated-chords'>
                <div class="song-chord-pair song-chord-pair  content"><a class='chord' href='chord://G'>G</a><span class="text">Nobody is </span></div>
                <div class="song-chord-pair song-chord-pair  content"><a class='chord' href='chord://D'>D</a><span class="text">talking.</span></div>
            </div>
        </div>
    </div>
    <div class='section section-0 section-type-bridge section-type-bridge0'>
        <div class="header">BRIDGE</div>

            <div class='song-text-line song-line song-line-has-text song-line-has-chords repeated-chords'>
                <div class="song-chord-pair song-chord-pair  content"><a class='chord' href='chord://Em'>Em</a><span class="text">Slow </span></div>
                <div class="song-chord-pair song-chord-pair  content"><a class='chord' href='chord://C'>C</a><span class="text">down.</span></div>
            </div>
        </div>
    </div>
    <div class='section section-0 section-type-chorus section-type-chorus0 section-copy section-repeat-only'>
        <div class="header">CHORUS</div>
        <div class="section-content">
            <div class='song-text-line song-line song-line-has-text song-line-has-chords'>
                <div class="song-chord-pair song-chord-pair  content"><a class='chord' href='chord://C'>C</a><span class="text">Oh, </span></div>

            </div>
        </div>

        <div class="header">OUTRO</div>
        <div class="section-content">
            <div class='song-text-line song-line song-line-has-text song-line-has-chords'>
                <div class="song-chord-pair song-chord-pair  content"><a class='chord' href='chord://G'>G</a><span class="text">End.</span></div>

        </div>
