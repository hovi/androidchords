<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <title>header-like-lyrics</title>
    <link href="style.css"/>
    <style rel="stylesheet">
    </style>
</head>
<body>
<!-- @formatter:off -->
<div class='main-song-content inline light font-normal display-chords display-text hide-comments  has-sections light font-normal display-chords display-text hide-comments'>
    <div class='section section-0 section-type-verse section-type-verse0'>
        <div class="header">VERSE</div>
        <div class="section-content">
        </div>
    </div>
    <div class='section section-0 section-type-unknown-section section-type-unknown-section0'>
        <div class="header">Řekni:</div>
        <div class="section-content">
            <div class='song-text-line song-line song-line-has-text song-line-no-chords'>
                <div class="song-chord-pair song-chord-pair  empty-chord  content">&nbsp;<span class="text">že mě máš rád,</span></div>
            </div>
        </div>
    </div>
    <div class='section section-1 section-type-verse section-type-verse1'>
        <div class="header">VERSE (2)</div>
        <div class="section-content">
            <div class='song-text-line song-line song-line-has-text song-line-no-chords'>
                <div class="song-chord-pair song-chord-pair  empty-chord  content">&nbsp;<span class="text">dubna jsem se narodil,</span></div>
            </div>
        </div>
    </div>
    <div class='section section-0 section-type-bridge section-type-bridge0'>
        <div class="header">BRIDGE</div>
        <div class="section-content">
            <div class='song-text-line song-line song-line-has-text song-line-no-chords'>
                <div class="song-chord-pair song-chord-pair  empty-chord  content">&nbsp;<span class="text">tohle je asi bridge,</span></div>
            </div>
            <div class='song-text-line song-line song-line-has-text song-line-no-chords'>
                <div class="song-chord-pair song-chord-pair  empty-chord  content">&nbsp;<span class="text">Pozor: tohle je text.</span></div>
            </div>
        </div>
    </div>
    
</div>
<!-- @formatter:on -->
</body>
</html>
