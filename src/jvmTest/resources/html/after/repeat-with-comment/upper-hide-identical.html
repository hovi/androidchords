<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <title>repeat-with-comment</title>
    <link href="style.css"/>
    <style rel="stylesheet">
    </style>
</head>
<body>
<!-- @formatter:off -->
<div class='main-song-content layout-upper theme-light font-normal hide-comments hide-identical-sequences  has-sections'>
    <div class='section section-0 section-type-chorus section-type-chorus0'>
        <div class="header">CHORUS</div>
        <div class="section-content">
            <div class='song-text-line song-line song-line-has-text song-line-has-chords'>
                <div class="song-chord-pair song-chord-pair ">
                    <div class="song-chord"><a class='chord' href='chord://C'>C</a></div>
                    <div class="song-text content" style=""><span class="text">Hello </span></div>
                </div>
                <div class="song-chord-pair song-chord-pair ">
                    <div class="song-chord"><a class='chord' href='chord://G'>G</a></div>
                    <div class="song-text content" style=""><span class="text">world</span></div>
                </div>
            </div>
        </div>
    </div>
    <div class='section section-0 section-type-verse section-type-verse0'>
        <div class="header">VERSE</div>
        <div class="section-content">
            <div class='song-text-line song-line song-line-has-text song-line-no-chords'>
                <div class="song-chord-pair song-chord-pair  empty-chord ">
                    <div class="song-chord"><a class='chord' href='chord://&nbsp;'>&nbsp;</a></div>
                    <div class="song-text content" style=""><span class="text">Verse</span></div>
                </div>
            </div>
        </div>
    </div>
    <div class='section section-0 section-type-chorus section-type-chorus0 section-copy section-repeat-only'>
        <div class="header">CHORUS</div>
        <div class="section-content">
            <div class='song-text-line song-line song-line-has-text song-line-no-chords comment-line'>
                <div class="song-chord-pair song-chord-pair  empty-chord ">
                    <div class="song-chord"><a class='chord' href='chord://&nbsp;'>&nbsp;</a></div>
                    <div class="song-text content" style=""><span class="text"><comment> softly this time</comment></span></div>
                </div>
            </div>
            <div class='song-text-line song-line song-line-has-text song-line-has-chords'>
                <div class="song-chord-pair song-chord-pair ">
                    <div class="song-chord"><a class='chord' href='chord://C'>C</a></div>
                    <div class="song-text content" style=""><span class="text">Hello </span></div>
                </div>
                <div class="song-chord-pair song-chord-pair ">
                    <div class="song-chord"><a class='chord' href='chord://G'>G</a></div>
                    <div class="song-text content" style=""><span class="text">world</span></div>
                </div>
            </div>
        </div>
    </div>
    <div class='section section-1 section-type-verse section-type-verse1'>
        <div class="header">VERSE (2)</div>
        <div class="section-content">
            <div class='song-text-line song-line song-line-has-text song-line-no-chords'>
                <div class="song-chord-pair song-chord-pair  empty-chord ">
                    <div class="song-chord"><a class='chord' href='chord://&nbsp;'>&nbsp;</a></div>
                    <div class="song-text content" style=""><span class="text">Second verse</span></div>
                </div>
            </div>
        </div>
    </div>
    <div class='section section-0 section-type-chorus section-type-chorus0 section-copy section-repeat-only'>
        <div class="header">CHORUS</div>
        <div class="section-content">
            <div class='song-text-line song-line song-line-has-text song-line-has-chords comment-line'>
                <div class="song-chord-pair song-chord-pair  empty-chord ">
                    <div class="song-chord"><a class='chord' href='chord://&nbsp;'>&nbsp;</a></div>
                    <div class="song-text content" style=""><span class="text"><comment> </span></div>
                </div>
                <div class="song-chord-pair song-chord-pair ">
                    <div class="song-chord"><a class='chord' href='chord://G'>G</a></div>
                    <div class="song-text content" style=""><span class="text"> last time slower</comment></span></div>
                </div>
            </div>
            <div class='song-text-line song-line song-line-has-text song-line-has-chords'>
                <div class="song-chord-pair song-chord-pair ">
                    <div class="song-chord"><a class='chord' href='chord://C'>C</a></div>
                    <div class="song-text content" style=""><span class="text">Hello </span></div>
                </div>
                <div class="song-chord-pair song-chord-pair ">
                    <div class="song-chord"><a class='chord' href='chord://G'>G</a></div>
                    <div class="song-text content" style=""><span class="text">world</span></div>
                </div>
            </div>
        </div>
    </div>
    
</div>
<!-- @formatter:on -->
</body>
</html>
