<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <title>identical-sequences</title>
    <link href="style.css"/>
    <style rel="stylesheet">
    </style>
</head>
<body>
<!-- @formatter:off -->
<div class='main-song-content inline light font-normal hide-identical-sequences display-chords display-text hide-comments  has-sections light font-normal hide-identical-sequences display-chords display-text hide-comments'>
    <div class='section section-0 section-type-verse section-type-verse0'>
        <div class="header">VERSE</div>
        <div class="section-content">
            <div class='song-text-line song-line song-line-has-text song-line-has-chords'>
                <div class="song-chord-pair song-chord-pair  content"><a class='chord' href='chord://C'>C</a><span class="text">První řádek </span></div>
                <div class="song-chord-pair song-chord-pair  content"><a class='chord' href='chord://G'>G</a><span class="text">s akordy </span></div>
                <div class="song-chord-pair song-chord-pair  content"><a class='chord' href='chord://Am'>Am</a><span class="text">tady,</span></div>
            </div>
            <div class='song-text-line song-line song-line-has-text song-line-no-chords'>
                <div class="song-chord-pair song-chord-pair  empty-chord  content">&nbsp;<span class="text">druhý řádek stejné akordy,</span></div>
            </div>
            <div class='song-text-line song-line song-line-has-text song-line-has-chords'>
                <div class="song-chord-pair song-chord-pair  content"><a class='chord' href='chord://F'>F</a><span class="text">jiné </span></div>
                <div class="song-chord-pair song-chord-pair  content"><a class='chord' href='chord://G'>G</a><span class="text">akordy,</span></div>
            </div>
            <div class='song-text-line song-line song-line-has-text song-line-no-chords'>
                <div class="song-chord-pair song-chord-pair  empty-chord  content">&nbsp;<span class="text">zase ty první tři.</span></div>
            </div>
        </div>
    </div>
    <div class='section section-0 section-type-chorus section-type-chorus0'>
        <div class="header">CHORUS</div>
        <div class="section-content">
            <div class='song-text-line song-line empty-line song-line-no-text song-line-no-chords'>
                <div class="song-chord-pair song-chord-pair  empty-chord  empty-pair  content">&nbsp;<span class="text"></span></div>
            </div>
            <div class='song-text-line song-line song-line-has-text song-line-no-chords'>
                <div class="song-chord-pair song-chord-pair  empty-chord  content">&nbsp;<span class="text">Upper řádek se stejnou sekvencí,</span></div>
            </div>
            <div class='song-text-line song-line empty-line song-line-no-text song-line-no-chords'>
                <div class="song-chord-pair song-chord-pair  empty-chord  empty-pair  content">&nbsp;<span class="text"></span></div>
            </div>
            <div class='song-text-line song-line song-line-has-text song-line-no-chords'>
                <div class="song-chord-pair song-chord-pair  empty-chord  content">&nbsp;<span class="text">a ještě jednou.</span></div>
            </div>
        </div>
    </div>
    
</div>
<!-- @formatter:on -->
</body>
</html>
