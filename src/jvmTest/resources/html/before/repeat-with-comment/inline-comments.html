<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <title>repeat-with-comment</title>
    <link href="style.css"/>
    <style rel="stylesheet">
    </style>
</head>
<body>
<!-- @formatter:off -->
<div class='main-song-content inline light font-normal display-chords display-text show-comments  has-sections light font-normal display-chords display-text show-comments'>
    <div class='section section-0 section-type-chorus section-type-chorus0'>
        <div class="header">CHORUS</div>
        <div class="section-content">
            <div class='song-text-line song-line song-line-has-text song-line-has-chords'>
                <div class="song-chord-pair song-chord-pair  content"><a class='chord' href='chord://C'>C</a>Hello </div>
                <div class="song-chord-pair song-chord-pair  content"><a class='chord' href='chord://G'>G</a>world</div>
            </div>
        </div>
    </div>
    <div class='section section-0 section-type-verse section-type-verse0'>
        <div class="header">VERSE</div>
        <div class="section-content">
            <div class='song-text-line song-line song-line-has-text song-line-no-chords'>
                <div class="song-chord-pair song-chord-pair  empty-chord  content">&nbsp;Verse</div>
            </div>
        </div>
    </div>
    <div class='section section-1 section-type-chorus section-type-chorus1'>
        <div class="header">CHORUS (2)</div>
        <div class="section-content">
            <div class='song-text-line song-line song-line-has-text song-line-no-chords'>
                <div class="song-chord-pair song-chord-pair  empty-chord  content">&nbsp;<comment> softly this time</comment></div>
            </div>
        </div>
    </div>
    <div class='section section-1 section-type-verse section-type-verse1'>
        <div class="header">VERSE (2)</div>
        <div class="section-content">
            <div class='song-text-line song-line song-line-has-text song-line-no-chords'>
                <div class="song-chord-pair song-chord-pair  empty-chord  content">&nbsp;Second verse</div>
            </div>
        </div>
    </div>
    <div class='section section-2 section-type-chorus section-type-chorus2'>
        <div class="header">CHORUS (3)</div>
        <div class="section-content">
            <div class='song-text-line song-line empty-line song-line-no-text song-line-no-chords'>
                <div class="song-chord-pair song-chord-pair  empty-chord  empty-pair  content">&nbsp;</div>
            </div>
            <div class='song-text-line song-line song-line-has-text song-line-has-chords'>
                <div class="song-chord-pair song-chord-pair  empty-chord  content">&nbsp;<comment> </div>
                <div class="song-chord-pair song-chord-pair  content"><a class='chord' href='chord://G'>G</a> last time slower</comment></div>
            </div>
        </div>
    </div>
    
</div>
<!-- @formatter:on -->
</body>
</html>
