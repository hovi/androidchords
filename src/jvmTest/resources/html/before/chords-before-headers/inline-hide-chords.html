<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <title>chords-before-headers</title>
    <link href="style.css"/>
    <style rel="stylesheet">
    </style>
</head>
<body>
<!-- @formatter:off -->
<div class='main-song-content inline light font-normal display-text hide-comments  has-sections light font-normal display-text hide-comments'>
    <div class='section section-0 section-type-intro section-type-intro0'>
        <div class="header">INTRO</div>
        <div class="section-content">
            <div class='song-text-line song-line empty-line song-line-no-text song-line-no-chords'>
                <div class="song-chord-pair song-chord-pair  empty-chord  empty-pair  content">&nbsp;</div>
            </div>
            <div class='song-text-line song-line song-line-has-text song-line-no-chords'>
                <div class="song-chord-pair song-chord-pair  empty-chord  content">&nbsp;1. Verse after a blank line</div>
            </div>
            <div class='song-text-line song-line song-line-has-text song-line-no-chords'>
                <div class="song-chord-pair song-chord-pair  empty-chord  content">&nbsp;2. Verse after a comment</div>
            </div>
            <div class='song-text-line song-line song-line-has-text song-line-no-chords'>
                <div class="song-chord-pair song-chord-pair  empty-chord  content">&nbsp;R: Chorus right under its chords</div>
            </div>
            <div class='song-text-line song-line song-line-has-text song-line-no-chords'>
                <div class="song-chord-pair song-chord-pair  empty-chord  content">&nbsp;lyric line</div>
            </div>
            <div class='song-text-line song-line song-line-has-text song-line-no-chords'>
                <div class="song-chord-pair song-chord-pair  empty-chord  content">&nbsp;3. Chords directly above move here</div>
            </div>
        </div>
    </div>
    <div class='section section-0 section-type-outro section-type-outro0'>
        <div class="header">OUTRO</div>
        <div class="section-content">
        </div>
    </div>
    <div class='section section-0 section-type-chorus section-type-chorus0'>
        <div class="header">CHORUS</div>
        <div class="section-content">
        </div>
    </div>
    
</div>
<!-- @formatter:on -->
</body>
</html>
