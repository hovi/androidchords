<html>
<head>

    <title>accented-headers</title>
    <style>
        .hide-comments comment {
            display: none;

        comment {
            display: block;

        img {
            max-width: 100%;

        h1 { font-size: 1.25em; }

        }
        .content {
            white-space: pre-wrap; tab-size: 1;
        }
        /* settings-specific */
        .font-monospace, .font-monospace .chord {
            font-family: 'monospace' !important;
        }
        .font-serif, .font-serif .chord {

        }
        .font-normal, .font-normal .chord {
            font-family: 'normal' !important;
        }
        .double-column {
            column-count: 2; column-gap: 30px; -webkit-column-count: 2; -webkit-column-gap: 30px;
        }
        .resize-chords .chord { font-size: 150% !important; }
        .use-bold, .use-bold .chord {
            font-weight: 900 !important;
        }
    </style>
</head>
<body class='light font-normal display-chords display-text hide-comments'>
<h1>accented-headers</h1>

<div class="content">Předehra:
