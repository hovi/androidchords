<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <title>comments-and-repeat-chords</title>
    <style>
        .hide-comments comment {
            display: none;
        }
        comment {
            display: block;
            font-style: italic;
        }
        img {
            max-width: 100%;
        }
        h1 { font-size: 1.25em; }
        .chord {
            text-decoration: none;
            color: black !important;
        }
        .content {
            white-space: pre-wrap; tab-size: 1;
        }
        /* settings-specific */
        .font-monospace, .font-monospace .chord {
            font-family: 'monospace' !important;
        }
        .font-serif, .font-serif .chord {
            font-family: 'serif' !important;
        }
        .font-normal, .font-normal .chord {
            font-family: 'normal' !important;
        }
        .double-column {
            column-count: 2; column-gap: 30px; -webkit-column-count: 2; -webkit-column-gap: 30px;
        }
        .resize-chords .chord { font-size: 150% !important; }
        .use-bold, .use-bold .chord {
            font-weight: 900 !important;
        }
    </style>
</head>
<body class='light font-normal display-text hide-comments'>
<h1>comments-and-repeat-chords</h1>
<!-- @formatter:off -->
<div class="content">1.
Hello world
  2x
  4x
/:   :/
      3x
Text under chords
R:
    (2x)
Last line</div>
<!-- @formatter:on -->
</body>
</html>
