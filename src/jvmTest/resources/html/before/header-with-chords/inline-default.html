        <div class="header">EMPTY</div>
        <div class="section-content">
            <div class='song-text-line song-line song-line-has-text song-line-no-chords'>
                <div class="song-chord-pair song-chord-pair  empty-chord  content">&nbsp;Intro: C G Am F</div>
            </div>
        </div>
    </div>
    <div class='section section-0 section-type-verse section-type-verse0'>

        <div class="section-content">
            <div class='song-text-line song-line song-line-has-text song-line-has-chords'>
                <div class="song-chord-pair song-chord-pair  content"><a class='chord' href='chord://C'>C</a>Sloka po intru,</div>
            </div>
            <div class='song-text-line song-line song-line-has-text song-line-has-chords'>

            </div>
            <div class='song-text-line song-line song-line-has-text song-line-has-chords'>
                <div class="song-chord-pair song-chord-pair  empty-chord  content">&nbsp;Mezihra: </div>
                <div class="song-chord-pair song-chord-pair  content"><a class='chord' href='chord://Am'>Am</a> </div>
                <div class="song-chord-pair song-chord-pair  content"><a class='chord' href='chord://F'>F</a></div>
            </div>
            <div class='song-text-line song-line song-line-has-text song-line-no-chords'>
                <div class="song-chord-pair song-chord-pair  empty-chord  content">&nbsp;R: C       G</div>
            </div>
            <div class='song-text-line song-line song-line-has-text song-line-no-chords'>
                <div class="song-chord-pair song-chord-pair  empty-chord  content">&nbsp;   Refrén s akordy</div>
            </div>
        </div>
    </div>
    
</div>
