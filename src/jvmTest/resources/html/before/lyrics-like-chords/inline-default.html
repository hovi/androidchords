<head>

    </style>

<body>
<!-- @formatter:off -->
<div class='main-song-content inline light font-normal display-chords display-text hide-comments  has-sections light font-normal display-chords display-text hide-comments'>
    <div class='section section-0 section-type-verse section-type-verse0'>
        <div class="header">VERSE</div>
        <div class="section-content">
            <div class='song-text-line song-line song-line-has-text song-line-no-chords'>
                <div class="song-chord-pair song-chord-pair  empty-chord  content">&nbsp;A je to tady, zase ráno,</div>
            </div>
            <div class='song-text-line song-line song-line-has-text song-line-no-chords'>
                <div class="song-chord-pair song-chord-pair  empty-chord  content">&nbsp;E, A, E, říká dítě,</div>
            </div>
            <div class='song-text-line song-line song-line-has-text song-line-no-chords'>
                <div class="song-chord-pair song-chord-pair  empty-chord  content">&nbsp;H a C jsou písmena,</div>
            </div>
            <div class='song-text-line song-line song-line-no-text song-line-has-chords'>
                <div class="song-chord-pair song-chord-pair  content"><a class='chord' href='chord://A'>A</a></div>
            </div>
            <div class='song-text-line song-line song-line-has-text song-line-has-chords'>
                <div class="song-chord-pair song-chord-pair  content"><a class='chord' href='chord://E'>E</a>Ahoj, Bude, Cesta, Dnes.</div>
            </div>
        </div>
    </div>
    
</div>
