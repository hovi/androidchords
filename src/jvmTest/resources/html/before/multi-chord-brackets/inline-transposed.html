<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <title>multi-chord-brackets</title>
    <link href="style.css"/>
    <style rel="stylesheet">
    </style>
</head>
<body>
<!-- @formatter:off -->
<div class='main-song-content inline light font-normal display-chords display-text hide-comments  has-sections light font-normal display-chords display-text hide-comments'>
    <div class='section section-0 section-type-verse section-type-verse0'>
        <div class="header">VERSE</div>
        <div class="section-content">
            <div class='song-text-line song-line song-line-has-text song-line-has-chords'>
                <div class="song-chord-pair song-chord-pair  content"><a class='chord' href='chord://D'>D</a> </div>
                <div class="song-chord-pair song-chord-pair  content"><a class='chord' href='chord://A'>A</a> </div>
                <div class="song-chord-pair song-chord-pair  content"><a class='chord' href='chord://Hm'>Hm</a>Tři akordy v jedné závorce,</div>
            </div>
            <div class='song-text-line song-line song-line-has-text song-line-has-chords'>
                <div class="song-chord-pair song-chord-pair  content"><a class='chord' href='chord://D'>D</a></div>
                <div class="song-chord-pair song-chord-pair  content"><a class='chord' href='chord://A'>A</a>čárkou oddělené,</div>
            </div>
            <div class='song-text-line song-line song-line-has-text song-line-has-chords'>
                <div class="song-chord-pair song-chord-pair  content"><a class='chord' href='chord://Emi'>Emi</a> </div>
                <div class="song-chord-pair song-chord-pair  content"><a class='chord' href='chord://D#'>D#</a> </div>
                <div class="song-chord-pair song-chord-pair  content"><a class='chord' href='chord://A#mi'>A#mi</a>s mezerami po čárce,</div>
            </div>
            <div class='song-text-line song-line song-line-has-text song-line-has-chords'>
                <div class="song-chord-pair song-chord-pair  empty-chord  content">&nbsp;konec řádku </div>
                <div class="song-chord-pair song-chord-pair  content"><a class='chord' href='chord://G'>G</a></div>
                <div class="song-chord-pair song-chord-pair  content"><a class='chord' href='chord://G#'>G#</a></div>
                <div class="song-chord-pair song-chord-pair  content"><a class='chord' href='chord://A'>A</a></div>
            </div>
        </div>
    </div>
    
</div>
<!-- @formatter:on -->
</body>
</html>
